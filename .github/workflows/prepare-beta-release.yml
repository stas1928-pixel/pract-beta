name: Prepare beta release draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-beta-release.yml']

permissions:
  contents: write

concurrency:
  group: pract-beta-release-draft
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'stas1928-pixel/pract-beta' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set release details and attach public instructions
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const repo = context.repo;
            const tag = 'v0.7.1-beta.1';
            const title = 'Pract Beta 0.7.1-beta.1';
            const files = ['INSTALL.txt','RELEASE-NOTES.txt','RIGHTS.txt','SHA256SUMS.txt'];
            const content = new Map();
            for (const path of files) {
              const result = await github.rest.repos.getContent({...repo, path, ref: context.sha});
              if (result.data.type !== 'file' || result.data.encoding !== 'base64') throw new Error('Expected a public text file: ' + path);
              content.set(path, Buffer.from(result.data.content.replace(/\s/g,''),'base64'));
            }
            const body = content.get('RELEASE-NOTES.txt').toString('utf8');
            const expectedHash = '6c0b914ff25dfd0107e572973d803f94ae43539c831babc57ee1465207834cdb';
            if (!content.get('SHA256SUMS.txt').toString('utf8').includes(expectedHash + '  Pract-0.7.1-beta.1.apk')) throw new Error('Unexpected APK checksum; stop and review the candidate.');
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page:100});
            let release = releases.find(item => item.tag_name === tag);
            if (!release) {
              const preparedDrafts = releases.filter(item => item.draft && item.name === title);
              if (preparedDrafts.length > 1) throw new Error('Multiple named beta drafts; review manually.');
              release = preparedDrafts[0];
            }
            if (release && !release.draft) {
              await core.summary.addHeading('Release already published').addLink('View release', release.html_url).addRaw('\nNo published release was modified.').write();
              return;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({...repo, tag_name:tag, target_commitish:context.sha, name:title, body, draft:true, prerelease:true})).data;
            } else {
              release = (await github.rest.repos.updateRelease({...repo, release_id:release.id, tag_name:tag, target_commitish:context.sha, name:title, body, draft:true, prerelease:true})).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id:release.id, per_page:100});
            for (const path of files) {
              if (assets.some(asset => asset.name === path)) continue;
              const data = content.get(path);
              await github.rest.repos.uploadReleaseAsset({...repo, release_id:release.id, name:path, data, headers:{'content-type':'text/plain; charset=utf-8','content-length':data.length}});
            }
            const apkName = 'Pract-0.7.1-beta.1.apk';
            let apk = assets.find(asset => asset.name === apkName);
            if (apk && (apk.size !== 3496982 || apk.digest !== 'sha256:' + expectedHash)) throw new Error('Existing APK asset metadata does not match audited candidate.');
            if (!apk) {
              const candidates = releases.filter(item => item.draft && item.id !== release.id)
                .flatMap(item => (item.assets || []).filter(asset => asset.name === apkName && asset.state === 'uploaded' && asset.size === 3496982));
              if (candidates.length > 1) throw new Error('Multiple APK candidates; review manually.');
              if (candidates.length === 1) {
                const candidate = candidates[0];
                const assetUrl = 'https://api.github.com/repos/' + repo.owner + '/' + repo.repo + '/releases/assets/' + candidate.id;
                const response = await fetch(assetUrl, {headers:{Accept:'application/octet-stream',Authorization:'Bearer ' + process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(30000)});
                if (!response.ok) throw new Error('Could not retrieve uploaded APK.');
                const bytes = Buffer.from(await response.arrayBuffer());
                const hash = require('node:crypto').createHash('sha256').update(bytes).digest('hex');
                if (bytes.length !== 3496982 || hash !== expectedHash) throw new Error('Uploaded APK does not match audited candidate; stop.');
                apk = (await github.rest.repos.uploadReleaseAsset({...repo, release_id:release.id, name:apkName, data:bytes,headers:{'content-type':'application/vnd.android.package-archive','content-length':bytes.length}})).data;
              }
            }
            const editUrl = release.html_url.replace('/releases/tag/','/releases/edit/');
            await core.summary.addHeading('Pract beta draft is prepared')
              .addLink('Open release draft', editUrl)
              .addRaw('\n\nTag, title, release notes, pre-release setting, and four text attachments are ready.\n\n' + (apk ? 'The APK is also attached. When copied from another draft, its bytes were checked against the audited checksum. The source draft was not changed.' : 'Attach only **Pract-0.7.1-beta.1.apk** from the local beta-upload folder.') + '\n\nExpected SHA-256: `' + expectedHash + '`.\n\nTest this exact beta APK on your phone before clicking Publish release. This workflow never publishes the release or enables website downloads.\n').write();

